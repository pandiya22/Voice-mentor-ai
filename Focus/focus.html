<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Focus Mode</title>

<link rel="stylesheet"
href="./focus.css">
</head>
<body>

<div class="mobile-frame">

<div class="focus-screen">

<h1>⏱ Focus Mode</h1>

<p class="subtitle">
Stay focused and earn XP
</p>

<div class="timer-container">

<div class="timer-circle">

<div class="timer-content">

<h2 id="timer">
25:00
</h2>

<p>
Pomodoro Session
</p>

</div>

</div>

</div>

<div class="controls">

<button class="start-btn">
▶ Start
</button>

<button class="pause-btn">
⏸ Pause
</button>

<button class="reset-btn">
🔄 Reset
</button>

</div>

<div class="stats-grid">

<div class="stat-card">

<h3>5</h3>

<p>Sessions</p>

</div>

<div class="stat-card">

<h3>72%</h3>

<p>Focus Score</p>

</div>

</div>

<div class="section-title">

Today's Progress

</div>

<div class="progress-card">

<div class="progress-item">

<span>Focus Time</span>

<b>2h 15m</b>

</div>

<div class="progress-item">

<span>XP Earned</span>

<b>+150 XP</b>

</div>

<div class="progress-item">

<span>Tasks Completed</span>

<b>6</b>

</div>

</div>

<div class="motivation-card">

🔥 Great Job!

Keep focusing to unlock
new achievements and earn
more XP.

</div>

</div>

<a href="../Reports/reports.html">

<a href="../Profile/profile.html">
👤
</a>

</nav>

</div>

<script src="./focus.js"></script>

</body>
</html>
