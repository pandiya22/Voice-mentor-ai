<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Voice Mentor AI</title>

<link rel="stylesheet" href="./login.css">
</head>
<body>

<div class="mobile-frame">

  <div class="login-screen">

    <div class="orb small-orb"></div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Continue your learning journey
    </p>

    <div class="form-group">

      <label>Email</label>

      <input
      type="email"
      id="email"
      placeholder="Enter your email">

    </div>

    <div class="form-group">

      <label>Password</label>

      <div class="password-box">

        <input
        type="password"
        id="password"
        placeholder="Enter your password">

        <button
        type="button"
        id="togglePassword">

          👁

        </button>

      </div>

    </div>

    <button
    class="login-btn">

      Login

    </button>

    <button
    class="google-btn">

      Continue with Google

    </button>

    <button
    class="text-btn">

      Forgot Password?

    </button>

    <p class="register-text">

      Don't have an account?

      <a href="../Register/register.html">
        Create Account
      </a>

    </p>

  </div>

</div>

<script src="./login.js"></script>

</body>
</html>
